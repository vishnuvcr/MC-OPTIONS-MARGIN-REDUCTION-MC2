name: Phase 2 Canary Run

on:
  push:
    branches:
      - phase-2-baseline-reconstruction
    paths-ignore:
      - "data/derived/**"
      - "data/raw/**"
  workflow_dispatch:

concurrency:
  group: phase2-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: data/raw
          key: nifty-batman-phase2-raw-v2
          restore-keys: |
            nifty-batman-phase2-raw-v2
          save-always: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow requests

      - name: Acquire source data
        run: python scripts/phase2_download_sources.py

      - name: Run baseline
        run: python src/phase2_baseline.py

      - name: Upload derived results
        uses: actions/upload-artifact@v4
        with:
          name: phase2-canary-results
          path: |
            data/derived/phase2_baseline_trade_ledger.csv
            data/derived/phase2_baseline_summary.json
            data/raw/source_manifest.json

      - name: Commit derived results
        run: |
          git config user.name "MC2 research bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/derived/phase2_baseline_trade_ledger.csv data/derived/phase2_baseline_summary.json data/raw/source_manifest.json
          git diff --cached --quiet || git commit -m "Store Phase 2 canary baseline [skip ci]"
          git push
