name: Phase 4 Canary Run

on:
  push:
    branches:
      - phase-4-walk-forward-sensex
    paths-ignore:
      - "data/derived/**"
  workflow_dispatch:

concurrency:
  group: phase4-canary
  cancel-in-progress: true

jobs:
  robustness:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: data/raw
          key: nifty-batman-phase2-raw-v2
          restore-keys: |
            nifty-batman-phase2-raw-v2
          save-always: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow requests

      - name: Acquire source data
        run: python scripts/phase2_download_sources.py

      - name: Rebuild Phase 3 candidate ledger
        run: python src/phase3_strike_search.py

      - name: Run walk-forward
        run: python src/phase4_walk_forward.py

      - name: Run cost stress
        run: python src/phase4_cost_stress.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: phase4-canary-results
          path: |
            data/derived/phase4_training_selection.csv
            data/derived/phase4_walk_forward_results.csv
            data/derived/phase4_sensex_regime_results.csv
            data/derived/phase4_run_summary.json
            data/derived/phase4_cost_stress.csv

      - name: Commit results
        run: |
          git config user.name "MC2 research bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/derived/phase4_*
          git diff --cached --quiet || git commit -m "Store Phase 4 results [skip ci]"
          git push
