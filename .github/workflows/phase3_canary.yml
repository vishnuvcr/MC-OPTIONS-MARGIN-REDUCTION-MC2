name: Phase 3 Canary Run

on:
  push:
    branches:
      - phase-3-strike-search
    paths-ignore:
      - "data/derived/**"
  workflow_dispatch:

concurrency:
  group: phase3-canary
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: data/raw
          key: nifty-batman-phase2-raw-v2
          restore-keys: |
            nifty-batman-phase2-raw-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow requests

      - name: Acquire source data
        run: python scripts/phase2_download_sources.py

      - name: Run Phase 3 search
        run: python src/phase3_strike_search.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: phase3-canary-results
          path: |
            data/derived/phase3_candidate_universe.json
            data/derived/phase3_candidate_trade_ledger.csv
            data/derived/phase3_candidate_summary.csv
            data/derived/phase3_retention_frontier.csv
            data/derived/phase3_run_summary.json

      - name: Commit results
        run: |
          git config user.name "MC2 research bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/derived/phase3_*
          git diff --cached --quiet || git commit -m "Store Phase 3 strike-search results [skip ci]"
          git push
