name: Phase 5 Manuscript

on:
  workflow_dispatch:

concurrency:
  group: phase5-manuscript
  cancel-in-progress: true

jobs:
  manuscript:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: data/raw
          key: nifty-batman-phase2-raw-v2
          restore-keys: |
            nifty-batman-phase2-raw-v2
          save-always: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow requests matplotlib

      - name: Acquire NIFTY and Sensex sources
        run: python scripts/phase2_download_sources.py

      - name: Rebuild Phase 3 candidate ledger
        run: python src/phase3_strike_search.py

      - name: Rebuild Phase 4 walk-forward
        run: |
          python src/phase4_walk_forward.py
          python src/phase4_cost_stress.py

      - name: Build manuscript and figures
        run: python src/build_manuscript.py

      - name: Upload manuscript
        uses: actions/upload-artifact@v4
        with:
          name: phase5-manuscript-package
          path: |
            manuscript/manuscript.md
            manuscript/figures/*
            data/derived/phase4_*
            data/derived/phase3_candidate_summary.csv
            data/derived/phase3_retention_frontier.csv

      - name: Commit manuscript outputs
        run: |
          git config user.name "MC2 research bot"
          git config user.email "actions@users.noreply.github.com"
          git add manuscript data/derived/phase3_candidate_summary.csv data/derived/phase3_retention_frontier.csv data/derived/phase4_*
          git diff --cached --quiet || git commit -m "Store final research manuscript package [skip ci]"
          git push
